<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Evaluation Summary Example</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    table { border-collapse: collapse; width: 100%; max-width: 900px; }
    th, td { border: 1px solid #ddd; padding: 8px; }
    th { background: #f4f4f4; text-align: left; }
    code { background:#f8f8f8; padding:2px 4px; border-radius:4px }
  </style>
</head>
<body>
  <h2>Real Evaluation Summary</h2>
  <p>Fetches <code>/api/v1/evaluation/summary</code> and displays counts + Eirene precision/recall.</p>

  <div id="summary"></div>

  <script>
    async function loadSummary() {
      try {
        const res = await fetch('/api/v1/evaluation/summary');
        if (!res.ok) throw new Error('Network response was not ok');
        const data = await res.json();

        const container = document.getElementById('summary');
        container.innerHTML = '';

        const meta = document.createElement('div');
        meta.innerHTML = `<strong>Rows evaluated:</strong> ${data.rows_evaluated}`;
        container.appendChild(meta);

        // Counts table
        const countsTable = document.createElement('table');
        countsTable.innerHTML = `<thead><tr><th>Category</th><th>Count</th></tr></thead>`;
        const countsBody = document.createElement('tbody');
        for (const [cat, cnt] of Object.entries(data.counts || {})) {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${cat}</td><td>${cnt}</td>`;
          countsBody.appendChild(tr);
        }
        countsTable.appendChild(countsBody);
        container.appendChild(document.createElement('h3')).innerText = 'Predicted counts (all sources)';
        container.appendChild(countsTable);

        // Eirene metrics
        const metrics = (data.metrics_by_source || {}).eirene;
        if (metrics) {
          const mTable = document.createElement('table');
          mTable.innerHTML = `<thead><tr><th>Category</th><th>Annotated</th><th>TP</th><th>FP</th><th>FN</th><th>Precision</th><th>Recall</th></tr></thead>`;
          const mBody = document.createElement('tbody');
          for (const [cat, v] of Object.entries(metrics)) {
            const p = v.precision === null ? '—' : v.precision.toFixed(3);
            const r = v.recall === null ? '—' : v.recall.toFixed(3);
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${cat}</td><td>${v.annotated_count}</td><td>${v.tp}</td><td>${v.fp}</td><td>${v.fn}</td><td>${p}</td><td>${r}</td>`;
            mBody.appendChild(tr);
          }
          mTable.appendChild(mBody);
          container.appendChild(document.createElement('h3')).innerText = 'Eirene annotated metrics';
          container.appendChild(mTable);
        } else {
          container.appendChild(document.createElement('p')).innerText = 'No Eirene metrics available.';
        }

      } catch (err) {
        document.getElementById('summary').innerText = 'Error loading summary: ' + err.message;
        console.error(err);
      }
    }

    loadSummary();
  </script>
</body>
</html>
